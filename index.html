
<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0b0b0d" />
    <meta name="author" content="CLIENT_NAME" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />



    <!-- Website Icons -->
<link rel="icon" type="image/jpeg" href="/images/2.jpeg" />
<link rel="apple-touch-icon" href="/1.jpeg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Dynamic SEO Metadata -->
    <!--app-head-->

    <script>
      // Restore saved theme before rendering.
      (function () {
        try {
          var theme = localStorage.getItem("client:theme");

          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (error) {}

        // Detect language from the URL.
        var segments = location.pathname.split("/");
        var language = segments[1];

        if (language === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
